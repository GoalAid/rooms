<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hotel Room Manager">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <title>客房管理</title>

  <style>
     html { visibility: hidden; }
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  color: #243042;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  font-size: 15px;
}

header {
  padding: 16px;
  color: white;
  background: #17324d;
}

header h1 {
  margin: 0;
  font-size: 1.2rem;
}

header p {
  margin: 4px 0 0;
  color: #c5d6e8;
  font-size: 0.85rem;
}

main {
  padding: 12px;
}

.summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;   
      margin: 0 10px 0 10px;  
      color: #435160;
      font-size: 0.85rem;
    }

    .summary strong { color: #17212b; }

.panel,
.room-card {
  border: 1px solid #e2e7ef;
  border-radius: 10px;
  background: white;
}

.panel {
  margin-bottom: 10px;
  padding: 12px;
}

.panel h2,
.section-heading h2 {
  margin: 0;
  font-size: 1rem;
}

.panel > h2 {
  margin-bottom: 10px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: end;
  margin-bottom: 12px;
  gap: 9px;
}

label {
  display: grid;
  gap: 5px;
  font-size: 0.78rem;
}

input,
select,
button {
  min-width: 0;
  min-height: 42px;
  padding: 8px 9px;
  border: 1px solid #cbd3de;
  border-radius: 7px;
  font: inherit;
  background: white;
}

button {
  cursor: pointer;
  font-weight: 600;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

form button {
  grid-column: 1 / -1;
}

.primary {
  color: white;
  background: #2459a6;
  border-color: #2459a6;
}

.danger {
  color: white;
  background: #b42318;
  border-color: #b42318;
}

.secondary {
  color: #243042;
  background: white;
}

.room-tools {
  display: flex;
  gap: 6px;
}

.room-tools select {
  flex: 1;
}

.room-tools button {
  padding-inline: 8px;
  font-size: 0.78rem;
}

.room-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}

.room-card {
  padding: 5px; 
}

.room-card.selected {
  outline: 2px solid #2459a6;
  outline-offset: 1px;
}

.room-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
} 
.room-name {
      display: flex;
      align-items: baseline;
      gap: 12px;      
    }
.room-top h3 {
  margin: 0;
  font-size: 1.1rem;
}
   
.badge {
  padding: 4px 8px;
  border-radius: 999px;
  background: #eef1f5;
  font-size: 0.72rem;
  text-transform: capitalize;
  white-space: nowrap;
}

.badge.可用 {
  color: #176b3a;
  background: #e7f6ec;
}

.badge.使用中 {
  color: #9a3412;
  background: #fff0e8;
}

.badge.待打扫 {
  color: #725400;
  background: #fff6d8;
}

.room-type,
.guest,
.stay {
  margin: 5px 0 0;
  color: #475467;
  font-size: 0.82rem;
}

.room-actions button {
  min-height: 36px;
  padding: 6px 9px;
  font-size: 0.8rem;
}

.counts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  color: #475467;
}

.empty {
  padding: 12px 0;
  color: #667085;
}

@media (max-width: 360px) {
  .summary-card {
    padding-inline: 3px;
  }

  .summary-card span {
    font-size: 0.62rem;
  }

  .room-tools button {
    max-width: 105px;
  }

   .delete-selected {
     padding: 0.35rem 0.6rem;
     font-size: 0.85rem;
  }

.backup-actions {
display: block;
margin-top: 12px;
width: 100%;
}

.backup-prompt {
text-align: left;
cursor: pointer;
}

.backup-options {
display: flex;
justify-content: center;
gap: 16px;
}

.backup-button {
  padding: 9px 16px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: transparent; 
  color: #435160;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}

.backup-button:hover {
  background: #334155;
}

.backup-button:focus-visible {
  outline: 2px solid #64748b;
  outline-offset: 2px;
}

.room-tools {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.room-actions {
  position: relative;
}

.room-actions-trigger {
  width: 2.25rem;
  height: 2.25rem;
  border: 1px solid #ccc;
  border-radius: 0.375rem;
  background: white;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
}

.room-actions-menu {
  position: absolute;
  top: calc(100% + 0.25rem);
  right: 0;
  z-index: 10;
  min-width: 8rem;
  padding: 0.25rem;
  border: 1px solid #ddd;
  border-radius: 0.375rem;
  background: white;
  box-shadow: 0 4px 12px rgb(0 0 0 / 12%);
}

.room-actions-menu button {
  display: block;
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.room-actions-menu button:hover:not(:disabled) {
  background: #f3f4f6;
}

.room-actions-menu .danger {
  color: #b42318;
}

.room-actions-menu button:disabled,
.room-actions-trigger:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
     [hidden] {
        display: none !important;
     }
    }

 #expiry-reminder {
    width: min(90vw, 420px);
    padding: 1.5rem;
    border: none;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgb(0 0 0 / 25%);  
  }

  #expiry-reminder-message {
    font-size: 1.25rem;
    line-height: 1.5;
    margin: 0 0 1.5rem;
  }

  #expiry-reminder button {
    padding: 0.6rem 1rem;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Align both buttons to the right and increase the space between them. */
  #expiry-reminder {
    text-align: left;
  }

  #expiry-reminder button + button {
    margin-left: 1rem;
  }

  #expiry-reminder #dismiss-reminders {
    background-color: #007bff;
    color: white;
  }

  #expiry-reminder::backdrop {
    background: rgb(0 0 0 / 45%);
  }

  .reminder-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 1rem;
}
  </style>
<script>
    (async() => {
      const expiry = localStorage.getItem("expiry");
      const expiryTime = expiry ? Date.parse(expiry) : NaN;     

      if (!Number.isFinite(expiryTime) || Date.now() >= expiryTime) {
        if (!navigator.onLine) {
          alert("请联网重试");
          window.close(); // May not work for an installed PWA.
          return;
        }

        const goToLogin = confirm(
          "您的订阅已过期，请登录继续操作"
        );

        if (goToLogin) {
          window.location.replace("login.html");
        } else {
          window.close(); // Browsers often prevent scripts closing app windows.
        }

        return;
      }

      // Entitlement is valid; allow the page to render.
      document.documentElement.style.visibility = "visible";
    })();
  </script>
</head>

<body>
<header>
    <h1 id="hotel-name">加载旅馆名称…</h1>
    <p>客房管理</p>
  </header>

<main>
   <div class="summary" aria-label="Room summary">
      <span>总房间数: <strong id="totalCount">0</strong></span>
      <span>使用中: <strong id="occupiedCount">0</strong></span>
      <span>可用: <strong id="availableCount">0</strong></span>
      <span>待打扫: <strong id="cleaningCount">0</strong></span>  
     <span>不可用: <strong id="ofsCount">0</strong></span> 
    </div>

<details class="backup-actions">
   <summary class="backup-prompt">备份</summary>

  <div class="backup-options">
    <button id="exportBackupButton" class="backup-button" type="button">
      导出
    </button>
    <button id="importBackupButton" class="backup-button" type="button">
      导入
    </button>
  </div>
<div><p>* 若导入时浏览器没反应，可刷新重试。</p></div>
</details>

<input
  id="backupFileInput"
  type="file"
  accept=".json,application/json"
  hidden
>

  <div class="section-heading">
  <div style="padding-left: 8px;">
  <h2 id="add-room-heading">添加房间</h2>
  </div>

  <button
    id="toggleAddRoom"
    class="secondary"
    type="button"
    aria-expanded="false"
    aria-controls="addRoomForm"
  >＋</button>
</div>
<form id="addRoomForm" hidden>
  <!-- Keep your existing labels and submit button here -->
          <label>
          房间号
          <input
            id="roomNumber"
            name="roomNumber"
            placeholder="e.g. 104"
            required
            maxlength="10"
          >
        </label>

        <label>
          房间类型
          <select id="roomType" name="roomType">
            <option>单人房</option>
            <option>大床房</option>
            <option>标准房</option>
            <option>套房</option>
            <option>床位</option>
          </select>
        </label>

        <button class="primary" type="submit">添加</button>
</form>

    <section class="panel">
      <div class="section-heading">
        <h2>房间</h2>

        <div class="room-tools">
          <select id="filter" aria-label="Filter rooms">
            <option value="all">所有房间</option>
            <option value="可用">✅ 可用</option>
            <option value="使用中">🔆使用中</option>
            <option value="待打扫">⚠️待打扫</option>
            <option value="不可用">🚫不可用</option>
          </select>

          <div class="room-actions">
    <button
      id="roomActionsButton"
      class="room-actions-trigger"
      type="button"
      aria-label="Room actions"
      aria-haspopup="true"
      aria-expanded="false"
      aria-controls="roomActionsMenu"
      disabled
    >
      &bull;
    </button>

    <div id="roomActionsMenu" class="room-actions-menu" hidden>
      <button id="deleteRoomButton" class="danger" type="button" disabled>
        删除
      </button>
      <button id="revokeRoomButton" type="button" disabled>
        停用
      </button>
    </div>
  </div>
</div>
</div>

      <div class="room-list" id="roomList"></div>
    </section>
  </main>
<dialog id="expiry-reminder">
  <p id="expiry-reminder-message"></p>
  <div class="reminder-buttons">
    <button id="cancel-button" type="button">取消</button>
    <button id="dismiss-reminders" type="button">不再提醒</button>
  </div>
</dialog>

  <script> document.addEventListener("DOMContentLoaded", () => {
  const expiry = localStorage.getItem("expiry");
  const expiryTime = expiry ? Date.parse(expiry) : NaN;
  //const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;
  const THREE_DAYS = 3 * 60 * 1000;

  const REMINDER_DISMISSED_KEY = "expiryReminderDismissed";

  if (!Number.isFinite(expiryTime)) {
    console.warn("Reminder not shown: expiry is missing or invalid.");
    return;
  }

  const remaining = expiryTime - Date.now();

  if (
    remaining > 0 &&
    remaining <= THREE_DAYS &&
    localStorage.getItem(REMINDER_DISMISSED_KEY) !== "true"
  ) {
    const dialog = document.getElementById("expiry-reminder");
    const message = document.getElementById("expiry-reminder-message");
    const cancelButton = document.getElementById("cancel-button");
    const dismissButton = document.getElementById("dismiss-reminders");

    if (!dialog || !message || !cancelButton || !dismissButton) {
      console.error("Reminder dialog HTML is missing or its IDs don't match.");
      return;
    }

    message.textContent =
      `提示💡：您的订阅到期时间是 ${new Date(expiryTime).toLocaleString().replaceAll('/', '-')}.`;

    if (!dialog.open) dialog.showModal();

    cancelButton.addEventListener("click", () => dialog.close());

    dismissButton.addEventListener("click", () => {
      localStorage.setItem(REMINDER_DISMISSED_KEY, "true");
      dialog.close();
    });
  }
});

  const toggleAddRoom = document.getElementById("toggleAddRoom");
  const addRoomForm = document.getElementById("addRoomForm");
 toggleAddRoom.addEventListener("click", () => {
    const isOpen = !addRoomForm.hidden;
    addRoomForm.hidden = isOpen;
    toggleAddRoom.setAttribute("aria-expanded", String(!isOpen));
    toggleAddRoom.textContent = isOpen ? "＋" : "−";
  });

    const STORAGE_KEY = "hotelRooms";

    const defaultRooms = [
      {
        number: "101",
        type: "单人房",
        status: "可用",
        guest: "",
        checkoutDate: ""
      },
      {
        number: "102",
        type: "大床房",
        status: "使用中",
        guest: "Jordan Lee",
        checkoutDate: ""
      },
      {
        number: "103",
        type: "套房",
        status: "待打扫",
        guest: "",
        checkoutDate: ""
      },
      {
        number: "201",
        type: "大床房",
        status: "可用",
        guest: "",
        checkoutDate: ""
      }
    ];

    function loadRooms() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : defaultRooms;
      } catch {
        return defaultRooms;
      }
    }

    let rooms = loadRooms();
    let selectedRoomNumber = null;

    const roomList = document.getElementById("roomList");
    const filter = document.getElementById("filter");
    const deleteRoomButton = document.getElementById("deleteRoomButton");
    const revokeRoomButton = document.getElementById("revokeRoomButton");

    function saveRooms() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms)); 
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getDaysRemaining(checkoutDate) {
      if (!checkoutDate) return null;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const checkout = new Date(`${checkoutDate}T00:00:00`);
      if (Number.isNaN(checkout.getTime())) return null;

      const millisecondsPerDay = 24 * 60 * 60 * 1000;
      return Math.max(
        0,
        Math.ceil((checkout.getTime() - today.getTime()) / millisecondsPerDay)
      );
    }

    function render() {
      const selectedFilter = filter.value;

      const visibleRooms = rooms
        .filter(room =>
          selectedFilter === "all" || room.status === selectedFilter
        )
        .sort((a, b) =>
          String(a.number).localeCompare(String(b.number), undefined, {
            numeric: true
          })
        );
  document.getElementById("totalCount").textContent = rooms.length;
      document.getElementById("availableCount").textContent =
        rooms.filter(room => room.status === "可用").length;
      document.getElementById("occupiedCount").textContent =
        rooms.filter(room => room.status === "使用中").length;
      document.getElementById("cleaningCount").textContent =
        rooms.filter(room => room.status === "待打扫").length;

document.getElementById("ofsCount").textContent =
  rooms.filter(room => room.status === "不可用").length;

      if (visibleRooms.length === 0) {
        roomList.innerHTML =
          '<div class="empty">没有符合条件的房间</div>';
        updateDeleteButton();
        return;
      }

      roomList.innerHTML = visibleRooms.map(room => {
        let action = "";

        if (room.status === "不可用") {
         action = `
        <button type="button" data-action="复用" data-room="${room.number}">
          复用
        </button>`;
    } else if (room.status === "可用") {
          action = `
            <button class="primary" data-action="入住"
              data-room="${escapeHtml(room.number)}">
              入住
            </button>
          `;
        } else if (room.status === "使用中") {
          action = `
            <button class="danger" data-action="退房"
              data-room="${escapeHtml(room.number)}">
              退房
            </button>
          `;
        } else {
          action = `
            <button class="primary" data-action="已打扫"
              data-room="${escapeHtml(room.number)}">
              已打扫
            </button>
           `;
        }
     
              
        let stayInfo = "";
        if (room.status === "使用中" && room.checkoutDate) {
          const days = getDaysRemaining(room.checkoutDate);
          stayInfo = days === null
            ? ""
            : `<p class="stay">剩余 ${days} ${days === 1 ? "天" : "天"} 
               (退房: ${escapeHtml(room.checkoutDate)})</p>`;
        }

        return `
          <article
            class="room-card ${String(room.number) === String(selectedRoomNumber) ? "selected" : ""}"
            data-room="${escapeHtml(room.number)}"
          >
            <div class="room-top">
            <div class="room-name">  
			  <h3>${escapeHtml(room.number)}</h3>
              <p class="room-type"> ${escapeHtml(room.type)}</p> 
            </div>
              <span class="badge ${escapeHtml(room.status)}">
                ${escapeHtml(room.status)}
              </span>
            </div>

         
            <p class="guest">
              ${room.guest
                ? `房客: ${escapeHtml(room.guest)}`
                : ""}
            </p>
            ${stayInfo}

            <div class="room-actions">${action}</div>
          </article>
        `;
      }).join("");

      updateDeleteButton();
    }

    function updateDeleteButton() {
  const selectedRoom = rooms.find(
    room => String(room.number) === String(selectedRoomNumber)
  );

  const canDelete = selectedRoom && selectedRoom.status !== "使用中";

  //deleteRoomButton.disabled = !canDelete;
  roomActionsButton.disabled = !selectedRoom; 

 deleteRoomButton.disabled =
    !selectedRoom || selectedRoom.status === "使用中";

  //revokeRoomButton.disabled =
    !selectedRoom || selectedRoom.status !== "不可用";

  revokeRoomButton.disabled =
  !selectedRoom ||
  !["可用", "待打扫"].includes(selectedRoom.status);
}
    document.getElementById("addRoomForm").addEventListener("submit", event => {
      event.preventDefault();

      const numberInput = document.getElementById("roomNumber");
      const typeInput = document.getElementById("roomType");
      const number = numberInput.value.trim();

      if (!number) {
        alert("请输入房间号");
        return;
      }

      if (rooms.some(
        room => String(room.number).toLowerCase() === number.toLowerCase()
      )) {
        alert("❗️该房间号已经存在");
        numberInput.focus();
        return;
      }

      rooms.push({
        number,
        type: typeInput.value,
        status: "可用",
        guest: "",
        checkoutDate: ""
      });

      saveRooms();
      event.target.reset();
      filter.value = "all";
      selectedRoomNumber = null;
      render();
    });

    roomList.addEventListener("click", event => {
      const actionButton = event.target.closest("button[data-action]");

      if (actionButton) {
        const room = rooms.find(
          item => String(item.number) === actionButton.dataset.room
        );

        if (!room) return;

        const action = actionButton.dataset.action;

        if (action === "入住") {
          const guest = prompt("请输入房客名字:");
          if (!guest || !guest.trim()) return;

          const checkoutDate = prompt(
            "请输入退房时间年-月-日，例如：2027-01-01):"
          );
          if (!checkoutDate) return;

          const parsedDate = new Date(`${checkoutDate}T00:00:00`);
          if (
            Number.isNaN(parsedDate.getTime()) ||
            !/^\d{4}-\d{2}-\d{2}$/.test(checkoutDate)
          ) {
            alert("请输入有效日期 年-月-日，例如：2027-01-01");
            return;
          }

          room.guest = guest.trim();
          room.checkoutDate = checkoutDate;
          room.status = "使用中";
        } else if (action=== "退房") {
          room.guest = "";
          room.checkoutDate = "";
          room.status = "待打扫";
        } else if (action === "已打扫") {
          room.status = "可用";
        } else if (action === "复用") {
  if (room.status !== "不可用") return;
  room.status = "可用";
}

        saveRooms();
        render();
        return;
      }

      const card = event.target.closest(".room-card");
if (!card) return;

const clickedRoomNumber = card.dataset.room;

selectedRoomNumber =
  String(selectedRoomNumber) === String(clickedRoomNumber)
    ? null
    : clickedRoomNumber;
     render();
});

deleteRoomButton.addEventListener("click", () => {
  const room = rooms.find(
    item => String(item.number) === String(selectedRoomNumber)
  );

  if (room) {
    deleteRoom(room);
  }
});

   function deleteRoom(room) {
  if (room.status === "使用中") {
    alert(`房间 ${room.number} 使用中，不可删除`);
    return;
  }

  if (!confirm(`删除 ${room.number} 房间吗? 此操作不可恢复`)) {
    return;
  }

  rooms = rooms.filter(
    item => String(item.number) !== String(room.number)
  );

  if (String(selectedRoomNumber) === String(room.number)) {
    selectedRoomNumber = null;
  }

  saveRooms();
  render();
}

   function revokeRoom(roomNumber) {
  const room = rooms.find(
    item => String(item.number) === String(roomNumber)
  );

  if (!room || !["可用", "待打扫"].includes(room.status)) return;

  room.status = "不可用";
  selectedRoomNumber = null;
  saveRooms();
  render();
}

 filter.addEventListener("change", render);

    render();

    if ("serviceWorker" in navigator) {
 
window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.error("Service worker registration failed:", error));
  });
	  }

document.getElementById("exportBackupButton").addEventListener("click", () => {
    const backup = {
    
    version: 1,
    exportedAt: new Date().toISOString(),
    rooms
  };

    const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json" }
  );

    const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `客房管理(备份)-${new Date().toISOString().slice(0, 10)}.json`;
  link.click();
  URL.revokeObjectURL(url);
});

    const backupFileInput = document.getElementById("backupFileInput");

document.getElementById("importBackupButton").addEventListener("click", () => {
  backupFileInput.click();
});

backupFileInput.addEventListener("change", async () => {
  const file = backupFileInput.files[0];
  if (!file) return;

  try {
    const backup = JSON.parse(await file.text());
    const importedRooms = Array.isArray(backup) ? backup : backup.rooms;

    if (
      !Array.isArray(importedRooms) ||
      !importedRooms.every(room =>
        room &&
        room.number != null &&
        typeof room.type === "string" &&
        ["可用", "使用中", "待打扫"].includes(room.status)
      )
    ) {
      throw new Error("该文件没有有效的房间数据");
    }

    if (!confirm("导入数据将覆盖当前房间列表，是否继续？")) {
      return;
    }

    rooms = importedRooms;
    selectedRoomNumber = null;
    saveRooms();
    render();
    alert("房间数据成功导入");
  } catch (error) {
    alert(`无法导入该备份: ${error.message}`);
  } finally {
    backupFileInput.value = "";
  }
});

function closeActionsMenu() {
  actionsMenu.hidden = true;
  actionsButton.setAttribute("aria-expanded", "false");
}

actionsButton.addEventListener("click", () => {
  const isOpen = actionsButton.getAttribute("aria-expanded") === "true";
  actionsMenu.hidden = isOpen;
  actionsButton.setAttribute("aria-expanded", String(!isOpen));
});

document.addEventListener("click", (event) => {

});

deleteButton.addEventListener("click", () => {
