<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Management</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
    }

    .intro {
      max-width: 650px;
      margin: 0 auto 24px;
      color: #667085;
      line-height: 1.6;
    }

    .demo {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #172033;
      box-shadow: 0 8px 28px rgb(30 45 75 / 12%);
    }

    .demo video,
    .demo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
     margin-bottom: 20px;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-block;
      padding: 12px 18px;
      border: 1px solid #3659c9;
      border-radius: 8px;
      background: #3659c9;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .button.secondary {
      background: #fff;
      color: #3659c9;
    }
  </style>
</head>
<body>
  <main>
    <h1>Manage your hotel with confidence</h1>
    <p class="intro">
      See how you can manage your hotel rooms in one place.
      Register to start your 7-day free trial.
    </p>

    <div class="demo">
      <video
        controls
        playsinline
        preload="metadata"
        poster="/images/demo-poster.jpg"
      >
        <source src="/videos/hotel-demo.mp4" type="video/mp4" />
        Your browser does not support video playback.
      </video>
    </div>

    <div class="actions">
      <a class="button" href="/register.html">Start your 7-day free trial</a>
      <a class="button secondary" href="/login.html">Log in</a>
    </div>
  </main>
</body>
</html>
