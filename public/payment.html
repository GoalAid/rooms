<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收款码</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }
      
        .center {
           display: block;
           margin-left: auto;
           margin-right: auto;
           width: 70%;
         }

        .container {
          margin-bottom: 20px; 
        }
       
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

       .bottom-text {
            position: absolute; 
            bottom: 10px;   
            padding-right: 10px;                  
            color: red;          
            text-align: center;          
        }
    </style>
</head>
<body>

    <h1>收款码</h1>
   <div class="container">
   <img src="wx_qr_code.png" id="img" class="center"> 
    <button onclick="toggleQRCode()">切换收款码</button>
    <button onclick="downloadQRCode()">下载收款码</button>
   </div>

        <div class="bottom-text">
            * 1、付款时请在备注中注明“用户名”和“旅馆名称”；2、付款当天立即生效。
        </div>

    <script>  
    let isWechatPay = true;
    const image = document.getElementById("img");
    function toggleQRCode() { 
        if (isWechatPay) {
            image.src = "alipay_qr_code.jpg";
        } else {
            image.src = "wx_qr_code.png";
        }
        isWechatPay = !isWechatPay;
    }

     function downloadQRCode() {
            const link = document.createElement('a');
            link.href = isWechatPay ? 'wx_qr_code.png' : 'alipay_qr_code.jpg';
            link.download = isWechatPay ? '客房管理-微信收款码' : '客房管理-支付宝收款码';
            document.body.appendChild(link);
            link.click();         document.body.removeChild(link);
        }
</script>
</body>
</html>
